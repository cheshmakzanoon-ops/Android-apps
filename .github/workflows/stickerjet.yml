name: StickerJet CI

# Authoritative Android verification runs here, on GitHub-hosted runners whose Android SDK and
# Google Maven access are available. Pushes that touch only other apps do not start this workflow.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/stickerjet/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/stickerjet.yml"
  pull_request:
    paths:
      - "apps/stickerjet/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/stickerjet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stickerjet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core JVM tests (domain, codec, mask math)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: ./gradlew :apps:stickerjet-core:test --console=plain
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stickerjet-core-test-reports
          path: apps/stickerjet/core/build/reports/tests/
          retention-days: 14

  android:
    name: Android unit tests, lint, debug APK and release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test and lint
        run: >-
          ./gradlew
          :apps:stickerjet:testDebugUnitTest
          :apps:stickerjet:lintDebug
          :apps:stickerjet:assembleDebug
          :apps:stickerjet:bundleRelease
          --console=plain --stacktrace
      - name: Verify the merged debug manifest requests no INTERNET permission
        run: |
          manifest=$(find apps/stickerjet/build/intermediates -path '*merged_manifests/debug*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest" || { echo "Merged debug manifest not found"; exit 1; }
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "INTERNET permission found in $manifest"; exit 1
          fi
          echo "No INTERNET permission in $manifest"
      - name: Verify the merged manifest policy (no storage, backup off, private FileProvider)
        run: |
          manifest=$(find apps/stickerjet/build/intermediates -path '*merged_manifests/debug*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest" || { echo "Merged debug manifest not found"; exit 1; }
          python3 - "$manifest" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ANDROID = "{http://schemas.android.com/apk/res/android}"
          FORBIDDEN_PERMISSIONS = {
              "android.permission.INTERNET",
              "android.permission.MANAGE_EXTERNAL_STORAGE",
              "android.permission.ACCESS_MEDIA_LOCATION",
          }
          FORBIDDEN_SUFFIX = ("_EXTERNAL_STORAGE",)
          FORBIDDEN_PREFIX = ("android.permission.READ_MEDIA_",)

          root = ET.parse(sys.argv[1]).getroot()
          problems = []
          for node in root.iter("uses-permission"):
              name = node.get(ANDROID + "name", "")
              if name in FORBIDDEN_PERMISSIONS or name.endswith(FORBIDDEN_SUFFIX) or name.startswith(FORBIDDEN_PREFIX):
                  problems.append(f"forbidden permission: {name}")

          app = root.find("application")
          if app is None or app.get(ANDROID + "allowBackup") != "false":
              problems.append('android:allowBackup must be "false" on <application>')

          providers = [p for p in root.iter("provider") if p.get(ANDROID + "authorities", "").endswith(".fileprovider")]
          if not providers:
              problems.append("no FileProvider (authority *.fileprovider) in the merged manifest")
          for provider in providers:
              if provider.get(ANDROID + "exported") != "false":
                  problems.append('FileProvider must have android:exported="false"')
              if provider.get(ANDROID + "grantUriPermissions") != "true":
                  problems.append('FileProvider must have android:grantUriPermissions="true"')

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("Merged manifest policy OK")
          PY
      - name: Record artifact checksums
        run: |
          find apps/stickerjet/build/outputs -name '*.apk' -o -name '*.aab' | while read -r f; do
            sha256sum "$f"
          done | tee "$RUNNER_TEMP/stickerjet-checksums.txt"
      - name: Upload debug APK and release AAB
        uses: actions/upload-artifact@v4
        with:
          name: stickerjet-build-outputs
          path: |
            apps/stickerjet/build/outputs/apk/debug/*.apk
            apps/stickerjet/build/outputs/bundle/release/*.aab
          retention-days: 14
      - name: Upload lint and unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stickerjet-quality-reports
          path: |
            apps/stickerjet/build/reports/
          retention-days: 14

  instrumented:
    name: Instrumented journey on an API 34 emulator (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Non-blocking until the journey has passed on this workflow. Remove this line after one green run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the instrumented journey on the emulator
        # The action runs every line of `script` in its own `sh -c`, and stops at the first failure.
        # The script is therefore one line: Gradle runs, the debuggable app's export is copied out
        # with run-as, and the Gradle exit code is kept for the step result.
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          script: >-
            ./gradlew :apps:stickerjet:connectedDebugAndroidTest --console=plain --stacktrace;
            rc=$?;
            out="${RUNNER_TEMP:-/tmp}/journey-output";
            mkdir -p "$out";
            adb=$(command -v adb || echo "$ANDROID_HOME/platform-tools/adb");
            "$adb" exec-out run-as com.agency.stickerjet cat files/journey-output/journey-export.webp > "$out/journey-export.webp" 2>/dev/null;
            if [ "$(head -c 4 "$out/journey-export.webp" 2>/dev/null)" != "RIFF" ]; then rm -f "$out/journey-export.webp"; fi;
            exit $rc
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stickerjet-instrumented-reports
          path: |
            apps/stickerjet/build/outputs/androidTest-results/
            apps/stickerjet/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: warn
      - name: Verify the exported sticker with an independent decoder
        if: always()
        run: |
          export_file="${RUNNER_TEMP}/journey-output/journey-export.webp"
          if [ ! -s "$export_file" ]; then
            echo "The journey left no export behind; nothing to verify."
            exit 0
          fi
          test -f apps/stickerjet/tools/verify_animated_webp.py || { echo "verify_animated_webp.py is missing (SJ-D4 deliverable)"; exit 1; }
          python -m pip install --quiet "Pillow==12.3.0"
          python -I apps/stickerjet/tools/verify_animated_webp.py "$export_file"
      - name: Upload the exported sticker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stickerjet-journey-export
          path: ${{ runner.temp }}/journey-output/
          retention-days: 14
          if-no-files-found: ignore
